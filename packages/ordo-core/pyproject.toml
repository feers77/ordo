[project]
name = "ordo-core"
version = "0.1.0"
description = "Kernel ORDO: registry, campos, dominios, environment"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordo_core"]
