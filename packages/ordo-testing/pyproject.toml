[project]
name = "ordo-testing"
version = "0.1.0"
description = "Fixtures, factories y arnés de la suite agéntica"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordo_testing"]
