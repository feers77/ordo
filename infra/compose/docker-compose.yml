name: ordo

# Perfiles:
#   core: postgres, pgbouncer, redis, nats, minio        (siempre)
#   dev:  keycloak, mailpit                              (desarrollo)
#   app:  api, iam, mcp, events                          (servicios ORDO)
#   obs:  otel-collector, prometheus, grafana, loki, tempo
# Prod: docker-compose.prod.yml (override con límites, sin mailpit).

services:
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: ordo-api:latest
    profiles: [app]
    environment:
      ORDO_DATABASE_URL: postgresql+asyncpg://ordo_app:${ORDO_APP_PASSWORD:?definir en .env}@postgres:5432/ordo
      # Rol dueño, exclusivamente para el DDL de los sandboxes (F3-03 §3):
      # clonar y borrar schemas. El tráfico normal jamás usa esta conexión.
      ORDO_ADMIN_DATABASE_URL: postgresql+asyncpg://ordo:${POSTGRES_PASSWORD:?definir en .env}@postgres:5432/ordo
      ORDO_IAM_URL: ${ORDO_IAM_URL:-http://iam:8000}
      # Traductor de lenguaje natural (ADR-017): vacío = endpoint 503. El
      # comando y su credencial son decisión del despliegue.
      ORDO_NL_COMMAND: ${ORDO_NL_COMMAND:-}
      ORDO_NL_RESULT_PATH: ${ORDO_NL_RESULT_PATH:-}
      ORDO_NL_TIMEOUT: ${ORDO_NL_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5

  iam:
    build:
      context: ../..
      dockerfile: services/iam/Dockerfile
    image: ordo-iam:latest
    profiles: [app]
    command: >
      sh -c "python -c 'import asyncio,os; from ordo_iam.migrations import upgrade_to_head;
      asyncio.run(upgrade_to_head(os.environ[\"IAM_DATABASE_URL\"]))'
      && uvicorn ordo_iam.main:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips '*'"
    environment:
      IAM_DATABASE_URL: postgresql+asyncpg://ordo:${POSTGRES_PASSWORD:?definir en .env}@postgres:5432/ordo_iam
      REDIS_URL: redis://redis:6379/0
      IAM_ISSUER: ${IAM_ISSUER:-http://iam:8000}
      IAM_SIGNING_KEY_FILE: /run/secrets/iam_signing_key
      # El issuer es el que ven los clientes al loguearse (host); el JWKS se
      # busca por la red interna de compose.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://127.0.0.1:8080/realms/ordo}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/ordo/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ordo-api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./secrets/iam_signing_key.pem:/run/secrets/iam_signing_key:ro
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: ../..
      dockerfile: services/mcp/Dockerfile
    image: ordo-mcp:latest
    profiles: [app]
    environment:
      ORDO_DATABASE_URL: postgresql+asyncpg://ordo_app:${ORDO_APP_PASSWORD:?definir en .env}@postgres:5432/ordo
      ORDO_IAM_URL: ${ORDO_IAM_URL:-http://iam:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5

  events:
    build:
      context: ../..
      dockerfile: services/events/Dockerfile
    image: ordo-events:latest
    profiles: [app]
    environment:
      ORDO_DATABASE_URL: postgresql+asyncpg://ordo_app:${ORDO_APP_PASSWORD:?definir en .env}@postgres:5432/ordo
      # Rol dueño, exclusivamente para el DDL de los sandboxes (F3-03 §3):
      # el worker recoge los vencidos con DROP SCHEMA. Nada más lo usa.
      ORDO_ADMIN_DATABASE_URL: postgresql+asyncpg://ordo:${POSTGRES_PASSWORD:?definir en .env}@postgres:5432/ordo
      ORDO_EVENTS_INTERVAL: ${ORDO_EVENTS_INTERVAL:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=3)'"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    build: ./postgres
    image: ordo-postgres:17
    profiles: [core, dev, app]
    environment:
      POSTGRES_USER: ordo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: ordo
      ORDO_APP_PASSWORD: ${ORDO_APP_PASSWORD:?definir en .env}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_S3_KEY:?definir en .env}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_S3_SECRET:?definir en .env}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=ordo archive-push %p
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/20-app-role.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordo -d ordo"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: [core, dev]
    environment:
      DB_HOST: postgres
      DB_USER: ordo
      DB_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ordo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: [core, dev, app]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    profiles: [core, dev]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    profiles: [core, dev]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir en .env}
    volumes:
      - miniodata:/data
      - ./minio/certs:/root/.minio/certs:ro
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -f https://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    profiles: [core, dev]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local https://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD --insecure &&
      mc mb -p local/attachments local/reports local/einvoicing local/pgbackrest --insecure &&
      mc admin user add local $$PGBACKREST_S3_KEY $$PGBACKREST_S3_SECRET --insecure &&
      mc admin policy attach local readwrite --user $$PGBACKREST_S3_KEY --insecure || true"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PGBACKREST_S3_KEY: ${PGBACKREST_S3_KEY:?definir en .env}
      PGBACKREST_S3_SECRET: ${PGBACKREST_S3_SECRET:?definir en .env}

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: [dev]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?definir en .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ordo
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_APPEND: "-Xms128m -Xmx400m"
    volumes:
      - ../keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/ordo HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: [obs]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:latest
    profiles: [obs]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

  loki:
    image: grafana/loki:latest
    profiles: [obs]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../observability/loki.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki

  tempo:
    image: grafana/tempo:latest
    profiles: [obs]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempodata:/var/tempo

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
  promdata:
  grafanadata:
  lokidata:
  tempodata:
