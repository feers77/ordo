# Config base pgBackRest (dentro del contenedor postgres).
# Credenciales S3 vía env: PGBACKREST_REPO1_S3_KEY / PGBACKREST_REPO1_S3_KEY_SECRET.
# PENDIENTE: repo externo real antes de producción (hoy: MinIO local).
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-endpoint=minio:9000
repo1-s3-bucket=pgbackrest
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-verify-tls=n
repo1-retention-full=2
repo1-retention-diff=6
start-fast=y
compress-type=zst
log-level-console=info
log-level-file=detail

[ordo]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=ordo
