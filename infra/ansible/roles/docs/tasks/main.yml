---
# La documentación de la API corre como servicio propio: es lo primero que
# alguien necesita para trabajar con ORDO y no debería depender de que alguien
# recuerde levantarla a mano.

- name: Servicio systemd de la documentación
  ansible.builtin.template:
    src: ordo-docs.service.j2
    dest: /etc/systemd/system/ordo-docs.service
    mode: "0644"
  notify: Reiniciar ordo-docs

- name: Documentación activa
  ansible.builtin.systemd_service:
    name: ordo-docs
    state: started
    enabled: true
    daemon_reload: true
