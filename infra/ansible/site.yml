---
- name: Provisionar servidor ORDO
  hosts: server
  become: true
  vars_files:
    - "{{ playbook_dir }}/secrets.yml"
  roles:
    - { role: base, tags: [base] }
    - { role: security, tags: [security] }
    - { role: users, tags: [users] }
    - { role: docker, tags: [docker] }
    - { role: caddy, tags: [caddy] }
    - { role: backup, tags: [backup] }
    - { role: docs, tags: [docs] }
