[project]
name = "ordo-iam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ordo-runtime",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "joserfc>=1.0",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
]

[tool.uv.sources]
ordo-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordo_iam"]
