[project]
name = "ordo-render"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ordo-runtime"]

[tool.uv.sources]
ordo-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordo_render"]
